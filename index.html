<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom's Journal</title>
<style>
  :root { --bg: #FFFDF8; --ink: #2C2C2A; --ink-soft: #6B6A63; --card: #FFFFFF; --border: #ECE8DD; --coral: #F0997B; --purple: #AFA9EC; --purple-dark: #26215C; --purple-bg: #EEEDFE; --teal-bg: #E1F5EE; --teal-dark: #04342C; --amber: #FAC775; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header { text-align: center; padding: 56px 20px 28px; }
  .filters { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 24px 0 36px; }
  .filter-btn { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; background: var(--teal-bg); color: var(--teal-dark); }
  .filter-btn.active { background: var(--purple); color: var(--purple-dark); }
  .posts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; padding-bottom: 60px; }
  .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; cursor: pointer; transition: transform 0.18s ease; text-decoration: none; color: inherit; display: block; }
  .post-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
  .bar { height: 5px; border-radius: 4px; margin-bottom: 14px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 11px; border-radius: 10px; margin-bottom: 10px; text-transform: lowercase; }
  .post-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .post-excerpt { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .post-date { font-size: 12px; color: #9A988F; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Dom's Journal</h1>
    <p>Beberapa cerita tentang keseharian gue menjalani hidup ini</p>
  </header>

  <div class="filters" id="filters"></div>
  <div id="posts-container"><div class="loading">Memuat tulisan...</div></div>
</div>

<script>
  const COLORS = [{ bar: '#F0997B', bg: '#FAECE7', dark: '#4A1B0C' }, { bar: '#AFA9EC', bg: '#EEEDFE', dark: '#26215C' }, { bar: '#5DCAA5', bg: '#E1F5EE', dark: '#04342C' }];
  let allPosts = [];
  let activeCategory = 'semua';

  function colorFor(category) {
    let hash = 0;
    for (let i = 0; i < category.length; i++) hash += category.charCodeAt(i);
    return COLORS[hash % COLORS.length];
  }

  function renderPosts() {
    const container = document.getElementById('posts-container');
    const filtered = activeCategory === 'semua' ? allPosts : allPosts.filter(p => p.category === activeCategory);
    
    container.innerHTML = '<div class="posts">' + filtered.map(post => {
      const c = colorFor(post.category || 'umum');
      return `
        <a href="post.html?id=${post.id}" class="post-card">
          <div class="bar" style="background:${c.bar}"></div>
          ${post.category ? `<span class="tag" style="background:${c.bg};color:${c.dark}">${post.category}</span>` : ''}
          <div class="post-title">${post.title || 'Tanpa judul'}</div>
          <div class="post-excerpt">${post.excerpt || ''}</div>
          <div class="post-date">${post.date}</div>
        </a>
      `;
    }).join('') + '</div>';
  }

  fetch('posts.json').then(res => res.json()).then(data => {
    allPosts = data;
    renderPosts();
  });
</script>
</body>
</html>
