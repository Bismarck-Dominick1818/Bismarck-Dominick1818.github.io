<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom's Journal</title>
    <style>
        root {
    --bg: #FFFDF8;
    --ink: #2C2C2A;
    --ink-soft: #6B6A63;
    --card: #FFFFFF;
    --border: #ECE8DD;
    --coral: #F0997B;
    --coral-dark: #4A1B0C;
    --coral-bg: #FAECE7;
    --purple: #AFA9EC;
    --purple-dark: #26215C;
    --purple-bg: #EEEDFE;
    --teal: #5DCAA5;
    --teal-dark: #04342C;
    --teal-bg: #E1F5EE;
    --amber: #FAC775;
    --amber-dark: #412402;
    --amber-bg: #FAEEDA;
  }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fafafa; color: #333; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { color: #666; }
        
        /* Grid 3x3 Layout */
        #posts-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Styling Kartu */
        .post-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .post-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .cover-img { width: 100%; height: 200px; object-fit: cover; }
        .post-content { padding: 20px; flex-grow: 1; }
        .category { display: inline-block; padding: 4px 12px; background: #e0f7fa; color: #00796b; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
        .post-title { font-size: 1.2em; margin: 0 0 10px 0; }
        .post-date { color: #888; font-size: 0.9em; margin: 0; }

        @media (max-width: 900px) { #posts-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { #posts-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dom's Journal</h1>
        <p>Beberapa cerita tentang keseharian gue menjalani kehidupan ini.</p>
    </div>

    <div id="posts-container">
        <!-- Kartu cerita akan dimuat di sini -->
    </div>

    <script>
        fetch('posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                posts.forEach(post => {
                    const coverHTML = post.cover ? `<img src="${post.cover}" class="cover-img" alt="Cover">` : '<div style="height:200px; background:#eee; display:flex; align-items:center; justify-content:center; color:#aaa;">No Cover</div>';
                    
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        ${coverHTML}
                        <div class="post-content">
                            <span class="category">${post.category}</span>
                            <h3 class="post-title">${post.title}</h3>
                            <p class="post-date">${post.date}</p>
                        </div>
                    `;
                    // Arahkan ke halaman spesifik saat diklik
                    card.onclick = () => { window.location.href = `post.html?id=${post.id}`; };
                    container.appendChild(card);
                });
            })
            .catch(error => console.error('Error loading posts:', error));
    </script>
</body>
</html>
