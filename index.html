<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom's Journal</title>
<style>
  :root { 
    --bg: #FFFDF8; --ink: #2C2C2A; --ink-soft: #6B6A63; --card: #FFFFFF; 
    --border: #ECE8DD; --purple: #AFA9EC; --purple-dark: #26215C; 
    --purple-bg: #EEEDFE; --teal-bg: #E1F5EE; --teal-dark: #04342C; 
  }
  /* Dark Mode Variables */
  body.dark-mode { 
    --bg: #1a1a19; --ink: #EAE9E4; --ink-soft: #A8A7A0; --card: #252524; --border: #333331; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  
  header { text-align: center; padding: 56px 20px 28px; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 30px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .filter-btn { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; background: var(--teal-bg); color: var(--teal-dark); }
  .filter-btn.active { background: var(--purple); color: var(--purple-dark); }
  
  .sort-select { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer; }
  #dark-mode-toggle { cursor: pointer; padding: 8px; border-radius: 50%; border: none; background: var(--border); }

  .posts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; padding-bottom: 60px; }
  .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; cursor: pointer; text-decoration: none; color: inherit; display: block; }
  .post-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
  .bar { height: 5px; border-radius: 4px; margin-bottom: 14px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 11px; border-radius: 10px; margin-bottom: 10px; }
  .post-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .post-excerpt { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; }
  .post-date { font-size: 12px; color: #9A988F; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Dom's Journal</h1>
    <button id="dark-mode-toggle">🌙 Mode Gelap/Terang</button>
  </header>

  <div class="controls">
    <select id="sort-select" class="sort-select">
      <option value="desc">Terbaru</option>
      <option value="asc">Terlama</option>
    </select>
    <div class="filters" id="filters"></div>
  </div>

  <div id="posts-container"><div class="loading">Memuat tulisan...</div></div>
</div>

<script>
  const COLORS = [{ bar: '#F0997B', bg: '#FAECE7', dark: '#4A1B0C' }, { bar: '#AFA9EC', bg: '#EEEDFE', dark: '#26215C' }, { bar: '#5DCAA5', bg: '#E1F5EE', dark: '#04342C' }];
  let allPosts = [];
  let activeCategory = 'semua';

  // 1. Dark Mode Toggle
  document.getElementById('dark-mode-toggle').addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
  });

  function renderPosts() {
    let filtered = activeCategory === 'semua' ? [...allPosts] : allPosts.filter(p => p.category === activeCategory);
    
    // 3. Sortir Berdasarkan Tanggal
    const sortOrder = document.getElementById('sort-select').value;
    filtered.sort((a, b) => {
      const dateA = new Date(a.date), dateB = new Date(b.date);
      return sortOrder === 'desc' ? dateB - dateA : dateA - dateB;
    });

    const container = document.getElementById('posts-container');
    container.innerHTML = '<div class="posts">' + filtered.map(post => {
      return `
        <a href="post.html?id=${post.id}" class="post-card">
          <div class="bar" style="background:${COLORS[0].bar}"></div>
          <div class="post-title">${post.title}</div>
          <div class="post-excerpt">${post.excerpt || ''}</div>
          <div class="post-date">${post.date}</div>
        </a>
      `;
    }).join('') + '</div>';
  }

  // 2. Render Kategori
  fetch('posts.json').then(res => res.json()).then(data => {
    allPosts = data;
    const cats = ['semua', ...new Set(allPosts.map(p => p.category).filter(Boolean))];
    const filtersEl = document.getElementById('filters');
    filtersEl.innerHTML = cats.map(c => `<button class="filter-btn ${c==='semua'?'active':''}" data-cat="${c}">${c}</button>`).join('');
    
    filtersEl.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', (e) => {
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeCategory = e.target.dataset.cat;
      renderPosts();
    }));

    document.getElementById('sort-select').addEventListener('change', renderPosts);
    renderPosts();
  });
</script>
</body>
</html>
