<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom's Journal</title>
<style>
  :root { 
    --bg: #FFFDF8; --ink: #2C2C2A; --ink-soft: #6B6A63; --card: #FFFFFF; 
    --border: #ECE8DD; --purple: #AFA9EC; --purple-dark: #26215C; 
    --purple-bg: #EEEDFE; --teal-bg: #E1F5EE; --teal-dark: #04342C; 
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
  
  header { text-align: center; padding: 56px 20px 40px; }
  
  /* Grid 3 kolom untuk dekstop */
  .posts { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 24px; 
    padding-bottom: 60px; 
  }
  
  /* Ukuran kartu diperbesar */
  .post-card { 
    background: var(--card); 
    border: 1px solid var(--border); 
    border-radius: 20px; 
    padding: 30px; 
    cursor: pointer; 
    text-decoration: none; 
    color: inherit; 
    display: block;
    min-height: 220px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .post-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  
  .bar { height: 6px; border-radius: 4px; margin-bottom: 20px; width: 100%; }
  .post-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .post-excerpt { font-size: 14px; color: var(--ink-soft); margin-bottom: 20px; }
  .post-date { font-size: 12px; color: #9A988F; }

  /* Responsif untuk layar lebih kecil */
  @media (max-width: 850px) { .posts { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .posts { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Dom's Journal</h1>
    <p>Beberapa cerita tentang keseharian gue menjalani hidup ini</p>
  </header>

  <div id="posts-container"><div class="loading">Memuat tulisan...</div></div>
</div>

<script>
  // Variasi warna untuk garis atas (bar)
  const BAR_COLORS = ['#F0997B', '#AFA9EC', '#5DCAA5', '#FAC775', '#85B7EB'];

  function getRandomColor() {
    return BAR_COLORS[Math.floor(Math.random() * BAR_COLORS.length)];
  }

  fetch('posts.json')
    .then(res => res.json())
    .then(posts => {
      const container = document.getElementById('posts-container');
      
      container.innerHTML = '<div class="posts">' + posts.map(post => {
        return `
          <a href="post.html?id=${post.id}" class="post-card">
            <div class="bar" style="background:${getRandomColor()}"></div>
            <div class="post-title">${post.title || 'Tanpa judul'}</div>
            <div class="post-excerpt">${post.excerpt || ''}</div>
            <div class="post-date">${post.date}</div>
          </a>
        `;
      }).join('') + '</div>';
    })
    .catch(() => {
      document.getElementById('posts-container').innerHTML = '<p>Gagal memuat data.</p>';
    });
</script>
</body>
</html>
