<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom's Journal</title>
<style>
  :root { 
    --bg: #FFFDF8; --ink: #2C2C2A; --ink-soft: #6B6A63; --card: #FFFFFF; 
    --border: #ECE8DD; --purple: #AFA9EC; --purple-dark: #26215C; 
    --purple-bg: #EEEDFE; --teal-bg: #E1F5EE; --teal-dark: #04342C; 
  }
  body.dark-mode { 
    --bg: #1a1a19; --ink: #EAE9E4; --ink-soft: #A8A7A0; --card: #252524; --border: #333331; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
  
  header { text-align: center; padding: 56px 20px 40px; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 40px; }
  
  /* Filter & Sort */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .filter-btn { padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; background: var(--teal-bg); color: var(--teal-dark); font-weight: 600; }
  .filter-btn.active { background: var(--purple); color: var(--purple-dark); }
  .sort-select { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink); }

  /* Grid 3 kolom */
  .posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-bottom: 60px; }
  
  /* Kartu Diperbesar */
  .post-card { 
    background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; 
    cursor: pointer; text-decoration: none; color: inherit; display: block; min-height: 250px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .post-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  
  .bar { height: 6px; border-radius: 4px; margin-bottom: 20px; }
  .post-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .post-excerpt { font-size: 14px; color: var(--ink-soft); margin-bottom: 20px; }
  .post-date { font-size: 12px; color: #9A988F; }

  @media (max-width: 850px) { .posts { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .posts { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Dom's Journal</h1>
    <button id="dark-mode-toggle" style="margin-top:10px; cursor:pointer;"> Klik untuk ubah Gelap/Terang</button>
  </header>

  <div class="controls">
    <select id="sort-select" class="sort-select">
      <option value="desc">Terbaru</option>
      <option value="asc">Terlama</option>
    </select>
    <div class="filters" id="filters"></div>
  </div>

  <div id="posts-container">Memuat...</div>
</div>

<script>
  const BAR_COLORS = ['#F0997B', '#AFA9EC', '#5DCAA5', '#FAC775', '#85B7EB'];
  let allPosts = [];
  let activeCategory = 'semua';

  document.getElementById('dark-mode-toggle').addEventListener('click', () => document.body.classList.toggle('dark-mode'));

  function renderPosts() {
    let filtered = activeCategory === 'semua' ? [...allPosts] : allPosts.filter(p => p.category === activeCategory);
    
    // Sortir
    const sortOrder = document.getElementById('sort-select').value;
    filtered.sort((a, b) => sortOrder === 'desc' ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));

    const container = document.getElementById('posts-container');
    container.innerHTML = '<div class="posts">' + filtered.map(post => `
      <a href="post.html?id=${post.id}" class="post-card">
        <div class="bar" style="background:${BAR_COLORS[Math.floor(Math.random() * BAR_COLORS.length)]}"></div>
        <div class="post-title">${post.title}</div>
        <div class="post-excerpt">${post.excerpt || ''}</div>
        <div class="post-date">${post.date}</div>
      </a>
    `).join('') + '</div>';
  }

  fetch('posts.json').then(res => res.json()).then(data => {
    allPosts = data;
    const cats = ['semua', ...new Set(allPosts.map(p => p.category).filter(Boolean))];
    const filtersEl = document.getElementById('filters');
    
    filtersEl.innerHTML = cats.map(c => `<button class="filter-btn ${c==='semua'?'active':''}" data-cat="${c}">${c}</button>`).join('');
    
    filtersEl.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', (e) => {
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeCategory = e.target.dataset.cat;
      renderPosts();
    }));

    document.getElementById('sort-select').addEventListener('change', renderPosts);
    renderPosts();
  });
</script>
</body>
</html>
