<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membaca...</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: #FFFDF8; 
    color: #2C2C2A; 
    line-height: 1.8; 
    padding: 40px 20px; 
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .back-btn { 
    display: inline-block; 
    margin-bottom: 20px; 
    text-decoration: none; 
    color: #6B6A63; 
    font-size: 14px; 
  }
  
  /* Gaya untuk Cover Image */
  #cover-img { 
    width: 100%; 
    height: 300px; 
    object-fit: cover; 
    border-radius: 16px; 
    margin-bottom: 24px; 
    display: none; 
  }

  #title { font-size: 32px; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
  #date { color: #9A988F; margin-bottom: 30px; font-size: 14px; }

  /* Gaya untuk Konten dengan Justify */
  .reader-content {
    text-align: justify;
    -webkit-hyphens: auto;
    hyphens: auto;
  }
  
  .reader-content img { max-width: 100%; border-radius: 12px; margin: 20px 0; }
  .reader-content p { margin-bottom: 18px; }
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="back-btn">← Kembali ke beranda</a>
  
  <img id="cover-img" src="" alt="Cover">
  <h1 id="title"></h1>
  <div id="date"></div>
  <div id="content" class="reader-content">Memuat tulisan...</div>
</div>

<script>
  // Mengambil ID dari URL
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  // Mengambil data dari posts.json
  fetch('posts.json')
    .then(res => res.json())
    .then(posts => {
      const post = posts.find(p => p.id === id);
      if (post) {
        document.title = post.title;
        document.getElementById('title').textContent = post.title;
        document.getElementById('date').textContent = post.date;
        document.getElementById('content').innerHTML = post.content;
        
        // Logika Menampilkan Cover
        if (post.cover) {
          const img = document.getElementById('cover-img');
          img.src = post.cover;
          img.style.display = 'block';
        }
      } else {
        document.getElementById('content').innerHTML = "Tulisan tidak ditemukan.";
      }
    })
    .catch(() => {
      document.getElementById('content').innerHTML = "Gagal memuat konten.";
    });
</script>

</body>
</html>
